name: Build

on: 
  push:
    branches:    
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install alsa
        shell: bash
        run: sudo apt update && sudo apt install libasound2-dev libavcodec-dev libavformat-dev libswscale-dev nasm
      - name: Fmt
        shell: bash
        run: cargo fmt --check
      - name: Fmt
        shell: bash
        run: cargo clippy --workspace -- -D warnings 

  build_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/ubuntu
      - name: ls
        run: ls -l app.zip
      - name: Upload Ubuntu App
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-ubuntu
          path: app.zip

  build_ubuntu_recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/ubuntu-recorder
      - name: ls
        run: ls -l app.zip
      - name: Upload Ubuntu Recorder App
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-cli-ubuntu
          path: app.zip

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/windows
      - name: ls
        run: ls -l target/release/piano-waterfall.exe
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-windows
          path: target/release/piano-waterfall.exe

  build_windows_recorder:
    runs-on: windows-latest

    env:
      FFMPEG_DOWNLOAD_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z
      
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/windows-recorder
      - name: ls
        run: ls -l target/release/piano-waterfall-cli.exe
      - name: Upload Windows Recorder Binary
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-cli-windows
          path: target/release/piano-waterfall-cli.exe

  build_macos:
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12

    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/macos
      - name: ls
        run: ls -l .github/app/app.zip
      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-macos
          path: .github/app/app.zip